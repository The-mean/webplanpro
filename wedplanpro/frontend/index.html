<!DOCTYPE html>
<html lang="tr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WedPlanPro - Düğün Planlama</title>
    <link href="./dist/output.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-base-200">
    <div class="hero min-h-screen">
        <div class="hero-content flex-col lg:flex-row-reverse">
            <div class="text-center lg:text-left lg:ml-8">
                <h1 class="text-5xl font-bold">WedPlanPro</h1>
                <p class="py-6">Düğün planlamanızı kolaylaştıran profesyonel çözüm</p>
                <div class="stats shadow">
                    <div class="stat">
                        <div class="stat-title">Görevler</div>
                        <div class="stat-value">Kolay Yönetim</div>
                    </div>
                    <div class="stat">
                        <div class="stat-title">Bütçe</div>
                        <div class="stat-value">Takip</div>
                    </div>
                    <div class="stat">
                        <div class="stat-title">Davetiyeler</div>
                        <div class="stat-value">Dijital</div>
                    </div>
                </div>
            </div>
            <div class="card flex-shrink-0 w-full max-w-sm shadow-2xl bg-base-100">
                <div class="card-body">
                    <div class="tabs tabs-boxed justify-center mb-4">
                        <a class="tab tab-active" data-tab="login">Giriş</a>
                        <a class="tab" data-tab="register">Kayıt</a>
                    </div>

                    <!-- Giriş Formu -->
                    <form id="loginForm" class="space-y-4">
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text">E-posta</span>
                            </label>
                            <input type="email" name="email" class="input input-bordered" required />
                        </div>
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text">Şifre</span>
                            </label>
                            <input type="password" name="password" class="input input-bordered" required />
                        </div>
                        <div class="form-control mt-6">
                            <button type="submit" class="btn btn-primary">Giriş Yap</button>
                        </div>
                    </form>

                    <!-- Kayıt Formu -->
                    <form id="registerForm" class="space-y-4 hidden">
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text">Ad Soyad</span>
                            </label>
                            <input type="text" name="name" class="input input-bordered" required />
                        </div>
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text">E-posta</span>
                            </label>
                            <input type="email" name="email" class="input input-bordered" required />
                        </div>
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text">Şifre</span>
                            </label>
                            <input type="password" name="password" class="input input-bordered" required />
                        </div>
                        <div class="form-control mt-6">
                            <button type="submit" class="btn btn-primary">Kayıt Ol</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Bildirimleri -->
    <div class="toast toast-top toast-end">
        <div id="successToast" class="alert alert-success hidden">
            <span id="successMessage"></span>
        </div>
        <div id="errorToast" class="alert alert-error hidden">
            <span id="errorMessage"></span>
        </div>
    </div>

    <script src="./app.js"></script>
</body>

</html>
